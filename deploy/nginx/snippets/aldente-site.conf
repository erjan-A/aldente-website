# Rules for serving the static build (dist/). Included inside a `server` block that sets `root` to dist/:
# the host config (aldenteai.com.conf) and the Docker image (docker.conf) share it.
#
# Astro builds every page as name.html (build.format 'file') and links to it without the extension or a
# trailing slash, so /aldo serves aldo.html and /solutions/hr serves solutions/hr.html.

index index.html;
charset utf-8;
server_tokens off;
absolute_redirect off;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

error_page 404 /404.html;

# One address per page: /aldo.html → /aldo, /index.html → /, /aldo/ → /aldo. These test $request_uri, the
# address the visitor asked for, so nginx's own internal lookups (index.html for /, 404.html) never loop.
if ($request_uri ~ "^/index\.html(\?.*)?$") {
    return 301 /$1;
}

if ($request_uri ~ "^/(.+)\.html(\?.*)?$") {
    return 301 /$1$2;
}

rewrite ^/(.+)/$ /$1 permanent;

# The 404 page is only ever shown as the answer to a missing address, with status 404.
location = /404.html {
    internal;
    include snippets/aldente-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location = /404 {
    return 404;
}

# Addresses from the previous site that other pages still link to.
location = /about {
    return 301 /company;
}

location = /careers {
    return 301 /company;
}

# Hashed build assets never change under the same name.
location /_astro/ {
    include snippets/aldente-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Pages and the files in public/ (favicon, og.jpg, robots.txt, sitemaps): revalidated on every visit,
# so a new deploy shows at once.
location / {
    include snippets/aldente-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri.html $uri/ =404;
}
