# Security headers for every response. The single source of truth: tests/unit/host-config.test.ts checks it,
# and tests/e2e/quality.spec.ts runs every page under this exact Content-Security-Policy.
#
# nginx gotcha: a location that sets its own add_header drops the server-level ones, so every location in
# aldente-site.conf includes this file again.
#
# CSP, in short: scripts, styles, fonts and images come from the site itself; Plausible (visit counting) may
# load its script and send events; Calendly's scheduler may be framed on /demo; nobody may frame this site.
# If PUBLIC_STATS_ENDPOINT is ever set, add its origin to connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://plausible.io; connect-src 'self' https://plausible.io; frame-src https://calendly.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
