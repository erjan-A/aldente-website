# aldenteai.com on a server running nginx (1.25.1 or later for `http2 on;`; on older nginx, drop that line
# and write `listen 443 ssl http2;`). See DEPLOY.md.
#
#   /etc/nginx/snippets/aldente-site.conf      ← deploy/nginx/snippets/aldente-site.conf
#   /etc/nginx/snippets/aldente-headers.conf   ← deploy/nginx/snippets/aldente-headers.conf
#   /etc/nginx/sites-available/aldenteai.com   ← this file (then link it into sites-enabled)
#   /var/www/aldenteai.com/dist/               ← the contents of dist/ from `npm run build`
#
# Certificates: the paths below are Let's Encrypt's (certbot). Change them if you use another CA.

# HTTP → HTTPS, and www → the bare domain.
server {
    listen 80;
    listen [::]:80;
    server_name aldenteai.com www.aldenteai.com;

    # Let certbot's HTTP challenge through before redirecting everything else.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://aldenteai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aldenteai.com;

    ssl_certificate /etc/letsencrypt/live/aldenteai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aldenteai.com/privkey.pem;

    return 301 https://aldenteai.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aldenteai.com;

    ssl_certificate /etc/letsencrypt/live/aldenteai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aldenteai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HSTS: turn on once HTTPS works for aldenteai.com and www (browsers then refuse plain HTTP for a year).
    # Add it inside snippets/aldente-headers.conf so every location sends it:
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/aldenteai.com/dist;
    include snippets/aldente-site.conf;
}
