# The Docker image's server (see Dockerfile). It speaks plain HTTP on port 80: put it behind the server's
# HTTPS reverse proxy, which also redirects www and HTTP to https://aldenteai.com.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    include snippets/aldente-site.conf;
}
